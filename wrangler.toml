name = "shaffii-chemasuet-foundation-worker"
main = "src/index.ts"
compatibility_date = "2024-09-25"

[vars]
ENVIRONMENT = "development"

[env.production]
vars = { ENVIRONMENT = "production" }

# Configure for local development
[dev]
port = 8787

# Build configuration
[build]
command = "npm run build"

# Routes will be configured in the Cloudflare dashboard
# or via Wrangler after deployment
routes = [
  { pattern = "api.foundation.example/*", zone_name = "foundation.example", script = "shaffii-chemasuet-foundation-worker" }
]
